name: Mirsa
options:
  bundleIdPrefix: com.mak5er
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.9.7"
    CURRENT_PROJECT_VERSION: "8.539.1"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  PrivateKits:
    path: vendor/PrivateKits
  ApplePackage:
    path: vendor/ApplePackage
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.5.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

targets:
  Mirsa:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes:
          - VideoCAML
          - WallpaperMakerMetadata
          - RuntimeTranslationAssets
          - BackgroundNotificationAssets
      - path: ios-app/VideoCAML
        type: folder
        buildPhase: resources
      - path: ios-app/WallpaperMakerMetadata
        type: folder
        buildPhase: resources
      - path: ios-app/RuntimeTranslationAssets
        type: folder
        buildPhase: resources
      - path: ios-app/BackgroundNotificationAssets
        type: folder
        buildPhase: resources
      - path: LICENSES/Gester-MIT.txt
        buildPhase: resources
      - path: LiveActivityShared
    dependencies:
      - package: PrivateKits
        product: AssetCatalogWrapper
      - package: ApplePackage
      - package: ZIPFoundation
      - package: swift-log
        product: Logging
      - target: MirsaLiveActivity
        embed: true
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "Mirsa"
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        # PrivateKits upstream bundles macOS stubs. Resolve untouched platform
        # exports for every production/device/simulator entrypoint, not CI only.
        OTHER_LDFLAGS[sdk=iphoneos*]: '$(inherited) -lc++ "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphoneos/CoreUI.tbd" "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphoneos/CoreSVG.tbd"'
        OTHER_LDFLAGS[sdk=iphonesimulator*]: '$(inherited) -lc++ "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphonesimulator/CoreUI.tbd" "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphonesimulator/CoreSVG.tbd"'
        GENERATE_INFOPLIST_FILE: NO
  MirsaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: MirsaLiveActivity
      - path: LiveActivityShared
    settings:
      base:
        PRODUCT_NAME: MirsaLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa.liveactivity
        INFOPLIST_FILE: MirsaLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MirsaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: uitests
    dependencies:
      - target: Mirsa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa.uitests
        TEST_TARGET_NAME: Mirsa
  MirsaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
        excludes:
          - "[Ff]ixtures/foreground/**"
          - "[Ff]ixtures/tendies/**"
          - "[Ff]ixtures/generic-injection25/**"
          - "[Ff]ixtures/exact-hooks25/**"
      - path: tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa
        buildPhase: resources
      - path: tests/fixtures/exact-hooks25/Alaa.dylib
        buildPhase: resources
      - path: tests/fixtures/exact-hooks25/MirsaHookTest.dylib
        buildPhase: resources
      - path: tests/fixtures/generic-injection25/GenericLaunch25Fixture.ipa
        buildPhase: resources
      - path: tests/fixtures/generic-injection25/GenericMarker25.dylib
        buildPhase: resources
      - path: tests/fixtures/generic-injection25/GenericHookMarker25.dylib
        buildPhase: resources
      - path: tests/fixtures/tendies/Naruto-Space.tendies
        buildPhase: resources
      - path: tests/fixtures/foreground/nasa-eileen-collins.jpg
        buildPhase: resources
      - path: rust-core/tests/fixtures/tweak-import/OwnerTikTokV4.zip
        buildPhase: resources
    # Hosted tests use the package already linked into Mirsa. Linking the same
    # static product again causes Xcode diamond dependency rejection. Its module
    # and exported symbols are available through the test host build products.
    dependencies:
      - target: Mirsa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa.tests
        OTHER_LDFLAGS[sdk=iphoneos*]: '$(inherited) "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphoneos/CoreUI.tbd" "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphoneos/CoreSVG.tbd"'
        OTHER_LDFLAGS[sdk=iphonesimulator*]: '$(inherited) "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphonesimulator/CoreUI.tbd" "$(SRCROOT)/vendor/PrivateKits/LinkerStubs/iphonesimulator/CoreSVG.tbd"'

schemes:
  Mirsa:
    build:
      targets:
        Mirsa: all
    test:
      targets:
        - MirsaTests
  MirsaUI:
    build:
      targets:
        Mirsa: all
    test:
      targets:
        - MirsaUITests
