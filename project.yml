name: Mirsa
options:
  bundleIdPrefix: com.mak5er
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.3"
    CURRENT_PROJECT_VERSION: "4.65.1"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  ApplePackage:
    path: vendor/ApplePackage
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.5.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

targets:
  Mirsa:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes:
          - VideoCAML
      - path: ios-app/VideoCAML
        type: folder
        buildPhase: resources
      - path: LiveActivityShared
    dependencies:
      - package: ApplePackage
      - package: ZIPFoundation
      - package: swift-log
        product: Logging
      - target: MirsaLiveActivity
        embed: true
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "Mirsa"
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
  MirsaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: MirsaLiveActivity
      - path: LiveActivityShared
    settings:
      base:
        PRODUCT_NAME: MirsaLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa.liveactivity
        INFOPLIST_FILE: MirsaLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MirsaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: uitests
    dependencies:
      - target: Mirsa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa.uitests
        TEST_TARGET_NAME: Mirsa
  MirsaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
      - path: rust-core/tests/fixtures/tweak-import/OwnerTikTokV4.zip
        buildPhase: resources
    dependencies:
      - target: Mirsa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.mirsa.tests

schemes:
  Mirsa:
    build:
      targets:
        Mirsa: all
    test:
      targets:
        - MirsaTests
  MirsaUI:
    build:
      targets:
        Mirsa: all
    test:
      targets:
        - MirsaUITests
