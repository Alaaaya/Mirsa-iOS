<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · مرسى</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,"Segoe UI",Tahoma,sans-serif;background:#101312;color:#f0f1e8}*{box-sizing:border-box}body{margin:0;padding:40px 24px;min-height:100vh;display:grid;place-items:center}main{max-width:520px;width:100%}.brand{letter-spacing:.24em;color:#b7d6a1;font-weight:750;font-size:13px}.box{border-right:3px solid #c0e698;padding:20px 24px;background:#1b211c;border-radius:8px;margin-top:20px}h1{font-size:clamp(26px,6vw,38px);margin:0 0 12px}p{color:#b7beb2;line-height:1.8;margin:0}a{display:inline-block;margin-top:28px;background:#c0e698;color:#15200e;text-decoration:none;padding:14px 24px;border-radius:7px;font-weight:750}a:focus-visible{outline:3px solid #c0e698;outline-offset:3px}
</style></head><body><main role="alert">
<div class="brand">MIRSA</div>
<div class="box"><h1>{{ title }}</h1><p>{{ message }}</p></div>
<a href="/admin">افتح صفحة الدخول من جديد</a>
</main></body></html>
