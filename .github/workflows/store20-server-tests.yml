name: Mirsa Store server transport verification
on:
  push:
    branches: [kat/store20-server]
permissions:
  contents: read
env:
  MIRSA_VERSION: "2.0"
jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: App Store standalone backend tests
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/appstore/package-tests.sh 2>&1 | tee build/store-server-tests.log
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Build AirliftFFI for iOS (device)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build unsigned IPA (same script as unsigned-ipa.yml, no release publishing)
        run: |
          # MIRSA_VERSION alone is not an Xcode build setting.
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path("project.yml")
          text, count = re.subn(r'MARKETING_VERSION: "[^"]+"', 'MARKETING_VERSION: "' + os.environ["MIRSA_VERSION"] + '"', path.read_text())
          assert count == 1
          path.write_text(text)
          PYTHON
          brew install xcodegen && xcodegen generate
          bash build-ipa.sh
          python3 - <<'PYTHON'
          import os, plistlib, zipfile
          with zipfile.ZipFile("build/Mirsa.ipa") as archive:
              for name in archive.namelist():
                  if name == "Payload/Mirsa.app/Info.plist" or name.endswith(".appex/Info.plist"):
                      assert plistlib.loads(archive.read(name))["CFBundleShortVersionString"] == os.environ["MIRSA_VERSION"], name
          PYTHON
      - name: Localization coverage
        run: |
          python3 ios-app/localization-coverage-test.py
          python3 ios-app/localization-plural-test.py
          python3 scripts/appstore/server-ui-contract-test.py
          python3 scripts/appstore/chat-ui-contract-test.py
          python3 scripts/appstore/delete-contract-test.py
          python3 scripts/appstore/source-ui-contract-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-store20-transport-device
          path: build/Mirsa.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-store20-transport-test-proof
          path: |
            build/store-server-tests.log
            build/store-server-ui-text-proof.json
            build/chat-ui-contract-proof.json
            build/delete-contract-proof.json
            build/source-ui-contract-proof.json
          if-no-files-found: error
