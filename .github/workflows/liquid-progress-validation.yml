name: Liquid progress validation
# Branch-only validation; never publishes.
on:
  push:
    branches: [mirsa/liquid-progress]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Parse every first-party Swift source
        run: |
          find ios-app uitests tests MirsaLiveActivity LiveActivityShared -name "*.swift" -print0 | xargs -0 -n 1 xcrun swiftc -frontend -parse
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run design review UITests
        run: |
          set -o pipefail
          brew install xcodegen
          # Real Keychain integration must run in an entitled, signed simulator host.
          # Match forge-validation; never skip or mock the real Security.framework test.
          python3 - <<'PYENT'
          import plistlib
          with open('/tmp/mirsa-ci-keychain.plist', 'wb') as f:
              plistlib.dump({'application-identifier': 'MIRSACI.com.alaa.mirsa', 'keychain-access-groups': ['MIRSACI.com.alaa.mirsa']}, f)
          PYENT
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")]; pick=[d for d in ds if d["name"] in ("iPhone 16 Pro","iPhone 17 Pro")] or ds; print(pick[0]["udid"])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          mkdir -p build
          # Keep unit failure blocking, but still collect independent UI evidence.
          set +e
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/DesignUnit.xcresult test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=/tmp/mirsa-ci-keychain.plist 2>&1 | tee build/design-unit.log
          UNIT_STATUS=$?
          set -e
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/DesignUI.xcresult -only-testing:MirsaUITests/MirsaStyleScreenshotsUITests/testLiquidProgress test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=/tmp/mirsa-ci-keychain.plist 2>&1 | tee build/design-ui.log
          exit "$UNIT_STATUS"
      - name: Export named screenshots
        if: always()
        run: |
          test -d build/DesignUI.xcresult || { echo "Missing UI result bundle"; exit 1; }
          if [ -d build/DesignUI.xcresult ]; then
            mkdir -p build/raw build/shots
            xcrun xcresulttool export attachments --path build/DesignUI.xcresult --output-path build/raw
            python3 - <<'PY'
          import json, os, re, shutil
          m = json.load(open("build/raw/manifest.json"))
          for t in m:
              for a in t.get("attachments", []):
                  src = os.path.join("build/raw", a["exportedFileName"])
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(\.\w+)$", r"\1", name)
                  name = re.sub(r'[^A-Za-z0-9._-]+', "_", name)
                  with open(src, "rb") as f: head = f.read(8)
                  if head.startswith(b"\x89PNG") or head[:3] == b"\xff\xd8\xff":
                      if not name.lower().endswith(".png"): name += ".png"
                      shutil.copy(src, os.path.join("build/shots", name))
          names = sorted(os.listdir("build/shots"))
          print("\n".join(names))
          expected = [f"liquid_{lang}_{phase}" for lang in ("ar", "en") for phase in ("levels", "completion")]
          missing = [name for name in expected if not any(n == name + ".png" or n.startswith(name + "_") for n in names)]
          if missing: raise SystemExit("Missing required screenshots: " + ", ".join(missing))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-progress-screenshots
          path: |
            build/shots
            build/design-ui.log
            build/design-unit.log
            build/raw
          if-no-files-found: error

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Test Rust validation
        run: cargo test --manifest-path rust-core/Cargo.toml --lib
      - name: Build Rust device library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build application
        run: |
          brew install xcodegen
          xcodegen generate
          bash build-ipa.sh
          mv build/Mirsa.ipa build/Mirsa-validation.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-liquid-progress
          path: build/Mirsa-validation.ipa
          if-no-files-found: error
