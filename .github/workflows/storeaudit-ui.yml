name: Store/settings UI runtime tests
on:
  workflow_dispatch:
  push:
    branches: [fix/storeaudit-22nov]
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run UI tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          set -o pipefail
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath dd -resultBundlePath build/ui.xcresult -only-testing:MirsaUITests/StoreSingleActionUITests -only-testing:MirsaUITests/CertificateParity29UITests test CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 2>&1 | tee ui.log | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: |
            build/ui.xcresult
            ui.log
