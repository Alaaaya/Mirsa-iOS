name: Wallpaper load23 native live proof
on:
  workflow_dispatch:
  push:
    branches: [mirsa/wallpaper-load23]
permissions:
  contents: read
jobs:
  simulator:
    timeout-minutes: 85
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact committed source bytes before native compile
        run: |
          python3 - <<'CHECK'
          import json, pathlib, hashlib, os, subprocess
          manifest = [{'path': 'ios-app/Apps/MirsaDesign.swift', 'sha256': 'c77ae35203a99da6dcc8ee9f31f2d6872c3df41b520d6e7183bbf5027050c2cf', 'blob': '39e57870a257a63ab6854d9faede059336cdbd39'}, {'path': 'ios-app/Apps/SourcesTab.swift', 'sha256': '4bc63189558c2282f78d77ac2ee8cbf58b5e244921c24df72828465cc381bc2c', 'blob': 'dd7e032438c80d5573115ca630bbaf2995b49de2'}, {'path': 'tests/MirsaTextDirectionTests.swift', 'sha256': '68dd95db3901681fe3475756dd442eeccfeaeb317a7afc2284bfe1b06388e07a', 'blob': 'ef362ee776a7d6bdcd3e976ace8364f70bea73a1'}, {'path': 'uitests/MirsaKeyboardReturn22UITests.swift', 'sha256': 'e9e1ae1a3a981cc78977708bf7b94b3ef6c1351b85797e7d04d5db488a767f4f', 'blob': 'a38c60c21503f33ae655f8174f702b0d7165dac4'}, {'path': 'ios-app/SourcesToolsStoreShotHost.swift', 'sha256': '4375489e32ec7fbdc26061ba0440ffab3659ac736d826685fc9d2ccf7679be27', 'blob': '78841806ccef44e368e22445c2c4a56616cc5d1b'}, {'path': 'uitests/MirsaArabicFeed22UITests.swift', 'sha256': '73281b234d93a70091e48cf7eeda368e70d294e5c1e20e0d403edea4d888c810', 'blob': '3fe5680b8c275654641acd7951e066454dd00f5e'}, {'path': 'uitests/CertificateParity29UITests.swift', 'sha256': '408555d892a0ada81c7606c80188712fd7e2b39101cd1745cceae2366a0ec73c', 'blob': '3815bdcd1534b14b51f750997be9b36ea1bbd27a'}]
          manifest += [{'path': 'ios-app/CAPlaygroundSource.swift', 'sha256': '9a561a98020fdafe1e4853788837b3124d475a0b20037b08f31797bd98aff363', 'blob': 'f77d6e128354ca4bd7f52c274b12717e5640aca4'}, {'path': 'tests/CAPlaygroundSourceTests.swift', 'sha256': '58781d7599d2bf8e16578333f17f455844943ea9ecd583cb42715c065c053f36', 'blob': '9e33cb2939e919e690333c1ba5bc4b27b4f8bdc2'}, {'path': 'ios-app/Apps/ToolsStore.swift', 'sha256': 'a1fbf187880f7ba3d313a73e57117eb23e3ffd646c18b24bb61029f8d7be383d', 'blob': '66802ec61ceaba3206afa762dc8daa955cc2ed9b'}, {'path': 'ios-app/Apps/ToolsStoreView.swift', 'sha256': '19e66642e8f6d43c21aa3ee249811f984f0428de78d6c48f3d4538442f6200ce', 'blob': 'f3130a24b78533c3c5cf5534b99826c937f99083'}, {'path': 'uitests/WallpaperSourceUITests.swift', 'sha256': 'ae916f7411b7d00cd909d051728d57c22dad982acd9c196cc8776c073ac40566', 'blob': '7035345382c71d7d92755a928828b6f36d40def4'}, {'path': 'backend/tools-store/logic.mjs', 'sha256': 'de244a3d3ade2e005c417f9e6c828fcdb6bec752141acc72fcbba15dc23c5c35', 'blob': 'c5eb0c935d28cb3fb5e35bb759989adf607563e0'}, {'path': 'backend/tools-store/logic.test.mjs', 'sha256': '3fc61514f0be0c2d4e6e7a18d170de9982bd93627579fbbaa19a0a1f00c5be78', 'blob': '39851bdd58d9fddbefee3717da1c5e6f306ac2f4'}, {'path': 'backend/tools-store/README.md', 'sha256': 'd36e20b873c181da9e7f726ca76480fa77939bf4a283026cab2f7780302a8236', 'blob': '7685f487b6c9564cd4aac5df657c089a06ba25e6'}]
          manifest += [{'path': 'tests/WallpaperSourceTests.swift', 'sha256': '0202f774e7dd09f45e363f1a8536ecac3ff711e85cec8d5933a38fb01c5c25ae', 'blob': '5de6103b60be23c3dab6e4cf2194dc125e281990'}]
          manifest += [{'path': 'ios-app/WallpaperSource.swift', 'sha256': 'a0e47b16865e275655410b5de65c131a6f62920ec2e900376db3eaa8e8186ab9', 'blob': 'a2750a129a49b30f0753f4b63f91b07678622fed'}, {'path': 'ios-app/WallpaperSourceView.swift', 'sha256': 'e0076ccad7e1e615b74b8d444bb1d8cd900c27a1cbbf3413aa4377dae5e376fc', 'blob': '6d153648d2da92396a48b1800296b7ad97c85d7d'}, {'path': 'ios-app/WallpaperSourceFixture.swift', 'sha256': 'fe1e1476c6853d6fc3ef1216ae0bf9dcd62fc302e8106530f3030f208bdc1b91', 'blob': 'c1d265c5c253c7596060ebeae228993e634d4f0c'}]
          manifest += [{'path': 'ios-app/ContentView.swift', 'sha256': '1c82905186fecdc516e4ba35f99056c3e731a91a48d39a23b90176f73ebc1110', 'blob': '5ab3664f38dc350d2789374a909b25f2d8a3850c'}]
          manifest += [{'path': 'ios-app/Apps/MirsaStyle.swift', 'sha256': '7ab5a6719465537d9065d971b0a3f19dfc150afaff126af5befafad66a4d66b1', 'blob': '3fd1ffb6bf7b7c5c78c0a53f6708a47d90ada79c'}]
          manifest += [{'path': 'ios-app/Apps/AppsView.swift', 'sha256': 'cc483ca60a43d6fc6537219cd676d7797a65b358e0e2896cf24c59bec46d7ee5', 'blob': '9cf01cd78575cae2964c189666fcc06fc7b462a6'}]
          manifest += [{'path': 'ios-app/Apps/EncryptedAppsTab.swift', 'sha256': '34034c9faafc74848b10872ab818aaf70e65fded842ef6d85ad65621ecd34afb', 'blob': '64e8d2d7467d76b518dfa5267de81c6c2e9a0f51'}]
          manifest += [{'path': 'ios-app/Apps/ClassicEncryptedAppsTab.swift', 'sha256': '6a52d3049453ccf0d1f2143d1ac619176658c5fe5e111893c770b87e3f109eca', 'blob': '17618891feda97c869de6c0d3f344cd7ad9a8705'}]
          manifest += [{'path': 'uitests/UnderDock23UITests.swift', 'sha256': '1bb6e9bb413f5850386178519f3a5b17a95dbd494e9ab9c65f26ea3f3023aba2', 'blob': '86729585f5001378a889122d87f1395bf7e14ed6'}]
          manifest += [{'path': 'ios-app/Apps/ForgeChatBuildProgress.swift', 'sha256': '53a05ceee1e26f61efc9e252dde8c7d49e51816cf67cd5a8455531eda5581e29', 'blob': 'f07923d12765844f10df79cc5e94b3ca6580ec9f'}, {'path': 'ios-app/Apps/ForgeChat.swift', 'sha256': 'cd8fefc2e212c18f70074ee8c15cd74de1e4e191b8802b9b6271e608e2b07928', 'blob': '12718ff4e4562596eada58ac2afd40099c5e0c97'}, {'path': 'tests/ForgeChatBuildProgressTests.swift', 'sha256': '24a583c4a4bce94daf533d81ce96e6413bca8e25a7f621121193acfa3f8dafa9', 'blob': '77c394ef36428c992980a741073bda5b3365751b'}]
          for f in manifest:
              data = pathlib.Path(f['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==f['sha256']
              assert subprocess.check_output(['git','rev-parse','HEAD:'+f['path']],text=True).strip()==f['blob']
          assert subprocess.check_output(['git','status','--porcelain'],text=True).strip()==''
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/source-proof.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'committedSource':True,'files':manifest},indent=2))
          CHECK
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Tools Store dylib font contract regression
        run: node --test backend/tools-store/logic.test.mjs
      - name: Standalone store package tests
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/appstore/package-tests.sh 2>&1 | tee build/package-tests.log
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run app screenshots tests
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/DirectionUnit.xcresult -only-testing:MirsaTests/MirsaTextDirectionTests -only-testing:MirsaTests/ForgeChatBuildProgressTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit-validation.log
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/ForegroundUI.xcresult -only-testing:MirsaUITests/UnderDock23UITests -only-testing:MirsaUITests/CertificateParity29UITests/testAllSixRealTabsScrollUnderDock -only-testing:MirsaUITests/TerminalStages23UITests -only-testing:MirsaUITests/MirsaArabicFeed22UITests -only-testing:MirsaUITests/MirsaForegroundUITests -only-testing:MirsaUITests/MirsaSourcesEdgeUITests -only-testing:MirsaUITests/MirsaKeyboardReturn22UITests -only-testing:MirsaUITests/CertificateParity29UITests/testArabicPushedSourceLastRowClearsDock -only-testing:MirsaUITests/CertificateParity29UITests/testEnglishPushedSourceLastRowClearsDock test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-validation.log
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/WallpaperSourceUnit.xcresult -only-testing:MirsaTests/WallpaperSourceTests -only-testing:MirsaTests/WallpaperSourceLiveTests -only-testing:MirsaTests/CAPlaygroundSourceTests -only-testing:MirsaTests/ReviewedToolsSourcesTests -only-testing:MirsaTests/MirsaWallpaperOwnershipTests -only-testing:MirsaTests/InstallErrorTextTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/wallpaper-unit.log
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/WallpaperSourceUI.xcresult -only-testing:MirsaUITests/WallpaperSourceUITests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/wallpaper-ui.log
      - name: Export runtime screenshot attachments
        if: always()
        run: |
          if [ -d build/ForegroundUI.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments --path build/ForegroundUI.xcresult --output-path build/screenshots
          fi
          if [ -d build/WallpaperSourceUI.xcresult ]; then
            mkdir -p build/wallpaper-screenshots
            xcrun xcresulttool export attachments --path build/WallpaperSourceUI.xcresult --output-path build/wallpaper-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-wallpaper-load23-native-proof
          path: |
            build/source-proof.json
            build/unit-validation.log
            build/DirectionUnit.xcresult
            build/screenshots
            build/ForegroundUI.xcresult
            build/simulator-validation.log
            build/package-tests.log
            build/wallpaper-unit.log
            build/wallpaper-ui.log
            build/WallpaperSourceUnit.xcresult
            build/WallpaperSourceUI.xcresult
            build/wallpaper-screenshots
          if-no-files-found: warn

  device:
    needs: simulator
    timeout-minutes: 70
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: terminal-stages-device
      - name: Build device FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Prepare private SDK and project
        run: |
          bash scripts/prepare-privatekits-sdk.sh iphoneos
          brew install xcodegen
          xcodegen generate
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
      - name: Build one private device IPA, no publish
        run: bash build-ipa.sh
      - name: Verify and record exact device artifact
        run: |
          python3 - <<'VERIFY'
          import zipfile,pathlib,hashlib,json,os,plistlib,shutil
          p=pathlib.Path('build/Mirsa.ipa')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              info=plistlib.loads(z.read('Payload/Mirsa.app/Info.plist'))
              assert 'iPhoneOS' in info.get('CFBundleSupportedPlatforms',[])
              assert z.getinfo('Payload/Mirsa.app/Mirsa').file_size>0
          pathlib.Path('build/device-proof.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'unsigned':True,'published':False},indent=2))
          VERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-terminal-wallpaper-private-device
          path: |
            build/Mirsa.ipa
            build/device-proof.json
          if-no-files-found: error
