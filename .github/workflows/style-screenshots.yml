name: Mirsa style screenshots
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to capture (default: the triggering ref)"
        required: false
        default: ""
      light_only:
        description: "Capture and pixel-check the corrected light dock only"
        type: boolean
        required: false
        default: false
      sources_clearance_only:
        description: "Diagnose real Sources last-row clearance across all themes"
        type: boolean
        required: false
        default: false
      full_window_only:
        description: "Capture all main/source themes, all tabs and both store styles edge-to-edge"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run style screenshot UITests
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")]; pick=[d for d in ds if d["name"] in ("iPhone 16 Pro","iPhone 17 Pro")] or ds; print(pick[0]["udid"])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/StyleUI.xcresult ${{ github.event.inputs.sources_clearance_only == 'true' && '-only-testing:MirsaUITests/MirsaStyleScreenshotsUITests/testFullWindowSourcesBackgroundThemesAndClearance' || github.event.inputs.full_window_only == 'true' && '-only-testing:MirsaUITests/MirsaStyleScreenshotsUITests/testFullWindowBackgroundAllTabsAndThemes -only-testing:MirsaUITests/MirsaStyleScreenshotsUITests/testFullWindowSourcesBackgroundThemesAndClearance' || github.event.inputs.light_only == 'true' && '-only-testing:MirsaUITests/SourcesToolsStoreScreenshotsUITests/testLightDockRenderedPixels -only-testing:MirsaUITests/SourcesToolsStoreScreenshotsUITests/testLightDockDoesNotLeakToOtherToolsSections -only-testing:MirsaUITests/SourcesToolsStoreScreenshotsUITests/testSourcesListAllThemes' || '-only-testing:MirsaUITests/SourcesToolsStoreScreenshotsUITests' }} test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/style-ui.log
      - name: Export named screenshots
        if: always()
        run: |
          if [ -d build/StyleUI.xcresult ]; then
            mkdir -p build/raw build/shots
            xcrun xcresulttool export attachments --path build/StyleUI.xcresult --output-path build/raw
            python3 - <<'PY'
          import json, os, re, shutil
          m = json.load(open("build/raw/manifest.json"))
          os.makedirs("build/diagnostics", exist_ok=True)
          for t in m:
              for a in t.get("attachments", []):
                  src = os.path.join("build/raw", a["exportedFileName"])
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(\.\w+)$", r"\1", name)
                  name = re.sub(r'[^A-Za-z0-9._-]+', "_", name)
                  with open(src, "rb") as f: head = f.read(8)
                  if head.startswith(b"\x89PNG") or head[:3] == b"\xff\xd8\xff":
                      if not name.lower().endswith(".png"): name += ".png"
                      shutil.copy(src, os.path.join("build/shots", name))
                  else:
                      shutil.copy(src, os.path.join("build/diagnostics", name + ".txt"))
          print("\n".join(sorted(os.listdir("build/shots"))))
          PY
          fi
          mkdir -p build/crashes
          cp ~/Library/Logs/DiagnosticReports/*Mirsa* build/crashes/ 2>/dev/null || true
          ls build/crashes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-store-sources-screenshots
          path: |
            build/shots
            build/diagnostics
            build/crashes
            build/style-ui.log
          if-no-files-found: warn
