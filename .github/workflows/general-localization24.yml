name: General Arabic localization private validation
on:
  workflow_dispatch:
  push:
    branches: [mirsa/general-localization24]
permissions:
  contents: read
jobs:
  build:
    needs: simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Test Rust validation
        run: cargo test --manifest-path rust-core/Cargo.toml --lib
      - name: Build Rust device library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build application
        run: |
          bash scripts/prepare-privatekits-sdk.sh iphoneos
          brew install xcodegen
          xcodegen generate
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          bash build-ipa.sh
          shasum -a 256 build/Mirsa.ipa > build/device.sha256
          git rev-parse HEAD > build/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-general-localization24-private-device
          path: |
            build/Mirsa.ipa
            build/device.sha256
            build/source-revision.txt
          if-no-files-found: error

  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run real localization tests in Arabic simulator
        run: |
          set -o pipefail
          bash scripts/prepare-privatekits-sdk.sh iphonesimulator
          brew install xcodegen
          xcodegen generate
          python3 scripts/configure-ui-language-tests.py
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/PersonalUI.xcresult -only-testing:MirsaTests/GeneralArabicLocalization24Tests -only-testing:MirsaTests/ArabicLocalize31Tests -only-testing:MirsaTests/CertificateInstallTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-validation.log
      - name: Export runtime screenshot attachments
        if: always()
        run: |
          if [ -d build/PersonalUI.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments --path build/PersonalUI.xcresult --output-path build/screenshots
          fi
          if [ -d build/SignedFolderUI.xcresult ]; then
            mkdir -p build/ui-screenshots
            xcrun xcresulttool export attachments --path build/SignedFolderUI.xcresult --output-path build/ui-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-general-localization24-Arabic-proof
          path: |
            build/screenshots
            build/ui-screenshots
            build/SignedFolderUI.xcresult
            build/signed-folder-ui.log
            build/PersonalUI.xcresult
            build/simulator-validation.log
          if-no-files-found: warn
