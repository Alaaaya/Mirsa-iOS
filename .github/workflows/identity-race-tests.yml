name: Identity race tests
on:
  workflow_dispatch:
  push:
    branches: [mirsa/identity-race-fix, mirsa/video-wallpaper]
permissions:
  contents: read
jobs:
  sim:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: German transient message probe
        run: python3 scripts/tests/test_store_unavailable_de.py
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run OTA tests
        run: |
          set -o pipefail
          mkdir -p build
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/D -only-testing:MirsaTests/StoreIdentityRaceTests -only-testing:MirsaTests/StoreSearchNavigationTests -only-testing:MirsaTests/StoreServerClientTests -only-testing:MirsaTests/StoreClientTests -only-testing:MirsaTests/StoreMetadataRetryPolicyTests -only-testing:MirsaTests/StoreSharedNameCacheTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ota-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-tests-log
          path: build/ota-tests.log
