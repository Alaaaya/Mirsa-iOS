name: Wallpaper source native validation
# CI-only. No release, Pages, source upload, signing or server deployment.
on:
  push:
    branches: [mirsa/wallpaper-source, mirsa/wallpaper-caplayground]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallpaper-source-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          set -o pipefail
          mkdir -p build
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim 2>&1 | tee build/rust.log
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Generate native project and boot simulator
        run: |
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")]; pick=[d for d in ds if d["name"] in ("iPhone 16 Pro","iPhone 17 Pro")] or ds; print(pick[0]["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
      - name: Native simulator build
        run: |
          set -o pipefail
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build.log
      - name: Native production decoder and five-language tests
        run: |
          set -o pipefail
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/WallpaperSourceUnit.xcresult -only-testing:MirsaTests/WallpaperSourceTests -only-testing:MirsaTests/CAPlaygroundSourceTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit.log
      - name: Real Tendies navigation and grid screenshots in five languages
        run: |
          set -o pipefail
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/WallpaperSourceUI.xcresult -only-testing:MirsaUITests/WallpaperSourceUITests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui.log
      - name: Export screenshots and crash diagnostics
        if: always()
        run: |
          mkdir -p build/screenshots build/crashes
          if [ -d build/WallpaperSourceUI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/WallpaperSourceUI.xcresult --output-path build/screenshots
          fi
          cp ~/Library/Logs/DiagnosticReports/*Mirsa* build/crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallpaper-source-native-evidence
          path: |
            build/*.log
            build/WallpaperSourceUnit.xcresult
            build/WallpaperSourceUI.xcresult
            build/screenshots
            build/crashes
          if-no-files-found: warn
