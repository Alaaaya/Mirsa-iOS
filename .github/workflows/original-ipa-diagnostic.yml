name: Original IPA ownership diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce pending archive lifetime
        run: |
          cat ios-app/Apps/MirsaContainerCleanup.swift ios-app/Apps/MirsaManagedTmp.swift scripts/diagnostics/original-ipa.swift > /tmp/original-ipa.swift
          swift /tmp/original-ipa.swift
