name: Owned native injection crash diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Read exact immutable owned archives from failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          gh api repos/Alaaaya/Mirsa-iOS/actions/artifacts/15089416021/zip > /tmp/owned-proof.zip
          python3 - <<'PY'
          import zipfile,pathlib
          out=pathlib.Path('owned');out.mkdir()
          with zipfile.ZipFile('/tmp/owned-proof.zip') as z:
              for mode in ('DIRECT','LOADER','HOOK'):
                  for suffix in ('.ipa','.ipa.mirsa-attempt.json'):
                      name='GENERIC-'+mode+suffix
                      (out/name).write_bytes(z.read('build/production-sign-proof/'+name))
          PY
          rm /tmp/owned-proof.zip
      - name: Reproduce exact launch and expose captured failure
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          python3 scripts/verify-generic-launch25.py owned "$DEVICE"
