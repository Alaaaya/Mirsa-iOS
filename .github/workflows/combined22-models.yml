name: Combined model and progress regression
on:
  workflow_dispatch:
  push:
    branches: [combined/22nov]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - name: Swift parse audit
        run: find ios-app uitests tests -name "*.swift" -print0 | xargs -0 xcrun swiftc -frontend -parse
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Rebuild current device FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Prepare SDK and project
        run: |
          bash scripts/prepare-privatekits-sdk.sh iphoneos
          brew install xcodegen
          xcodegen generate
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
      - name: Compile and package without publishing
        run: env -u GITHUB_RUN_NUMBER bash build-ipa.sh
      - name: Verify test artifact and stamp isolated test build
        run: |
          python3 - <<'STAMP'
          import plistlib,zipfile
          p='build/Mirsa.ipa'
          with zipfile.ZipFile(p) as z: entries=[(i,z.read(i.filename)) for i in z.infolist()]
          with zipfile.ZipFile(p,'w',zipfile.ZIP_DEFLATED) as z:
              for i,b in entries:
                  if i.filename=='Payload/Mirsa.app/Info.plist' or ('.appex/' in i.filename and i.filename.endswith('/Info.plist')):
                      v=plistlib.loads(b);v['CFBundleVersion']='8.539.1';b=plistlib.dumps(v)
                  z.writestr(i,b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              v=plistlib.loads(z.read('Payload/Mirsa.app/Info.plist'))
              assert v['CFBundleVersion']=='8.539.1'
              assert v['CFBundleShortVersionString']=='2.9.6'
          STAMP
          shasum -a 256 build/Mirsa.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-chat-build-progress-test-IPA
          path: build/Mirsa.ipa
          if-no-files-found: error

  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run app screenshots tests
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/PersonalUI.xcresult -only-testing:MirsaTests/ForgeChatBuildProgressTests -only-testing:MirsaTests/LocalDevVPNRouteTests -only-testing:MirsaTests/InstallErrorTextTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-validation.log
      - name: Export runtime screenshot attachments
        if: always()
        run: |
          if [ -d build/PersonalUI.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments --path build/PersonalUI.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-combined-model-synthetic-results
          path: |
            build/screenshots
            build/simulator-validation.log
          if-no-files-found: warn
