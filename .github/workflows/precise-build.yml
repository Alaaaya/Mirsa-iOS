name: Precise create build
on:
  workflow_dispatch:
  push:
    branches: [kat/precise-create]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$XC" ]; then XC=$(xcode-select -p | sed 's#/Contents/Developer##'); fi
          sudo xcode-select -s "$XC"
      - name: Synthetic purchase history parser and account-switch regression tests
        run: |
          python3 scripts/tests/store_ownership_intent_test.py
          python3 scripts/appstore/store-section-state-tests.py
          python3 scripts/appstore/history-runtime-tests.py
          python3 scripts/appstore/history-protocol-tests.py
          python3 scripts/appstore/history-local-tests.py
          python3 scripts/appstore/history-gate-tests.py
          python3 scripts/appstore/search-state-tests.py
          python3 scripts/appstore/discovery-tests.py
          python3 scripts/appstore/purchases-group-tests.py
          python3 scripts/appstore/version-name-tests.py
      - name: Offline Apple request parity and ownership evidence tests
        run: swift test --package-path vendor/ApplePackage --filter 'StoreOwnershipEvidenceTests|StoreDownloadRecoveryTests'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Build AirliftFFI for iOS (device)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core && cargo build --release --target aarch64-apple-ios && cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - run: brew install xcodegen && xcodegen generate
      - name: Build unsigned IPA (no publish)
        run: bash build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-precise-unsigned
          path: build/Mirsa.ipa
