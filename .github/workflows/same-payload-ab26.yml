name: Private same-payload owned UIKit engine comparison26
'on':
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Checkout the literal released engine and its own vendored signer
      uses: actions/checkout@v4
      with:
        ref: 3191476ccb9c3640c2286015bd3741f357e20a3f
        path: release296
        persist-credentials: false
    - name: Select Xcode
      run: 'XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)

        if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi

        xcodebuild -version

        '
    - name: Rebuild all embedded device libraries from this exact revision
      run: 'python3 scripts/test-hook-build-boundary.py

        python3 scripts/verify-native-fixture-uuid26.py

        rm -f hook-engine/dist/CydiaSubstrate.framework/CydiaSubstrate

        bash hook-engine/build.sh

        python3 scripts/test-verify-hook-engine.py

        python3 scripts/verify-hook-engine.py

        (cd runtime-translation && clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation MergeRace.m -o /tmp/mirsa-merge-race && /tmp/mirsa-merge-race)

        bash runtime-translation/build-apple.sh

        bash background-notifications/build-apple.sh

        python3 background-notifications/test_background.py

        mkdir -p runtime-translation/out

        cp ios-app/RuntimeTranslationAssets/MirsaTranslate.dylib runtime-translation/out/MirsaTranslate.dylib

        (cd runtime-translation && python3 test_runtime.py)

        '
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios-sim
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust-core
        key: simulator
    - name: Build real simulator FFI
      env:
        IPHONEOS_DEPLOYMENT_TARGET: '18.0'
      run: 'cargo test --manifest-path rust-core/vendor/apple-codesign-quick/Cargo.toml --lib

        cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim

        rm -rf AirliftFFI.xcframework

        xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework

        '
    - name: Prepare own-code real ad-hoc signed IPA fixture
      run: "mkdir -p build/SignedFixture/Payload/SignedFixture.app\nprintf 'int main(void) { return 0; }\\n' > build/SignedFixture/main.c\nSDK=$(xcrun --sdk iphoneos --show-sdk-path)\nxcrun --sdk iphoneos clang -arch arm64 -isysroot \"$SDK\" -miphoneos-version-min=18.0 build/SignedFixture/main.c -o build/SignedFixture/Payload/SignedFixture.app/SignedFixture\npython3 - <<'PY'\nimport pathlib,plistlib,zlib,struct\ndef png(path,size=120):\n    rows=[]\n    for y in range(size):\n        row=bytearray([0])\n        for x in range(size):\n            if (x//15+y//15)%2==0: px=(255,0,200)\n            else: px=(255,230,0)\n            if abs(x-y)<8 or abs(x+y-size)<8: px=(0,200,255)\n            row+=bytes(px)\n        rows.append(bytes(row))\n    raw=b\"\".join(rows)\n    def chunk(t,d): c=struct.pack(\">I\",len(d))+t+d; return c+struct.pack(\">I\",zlib.crc32(t+d)&0xffffffff)\n    path.write_bytes(b\"\\x89PNG\\r\\n\\x1a\\n\"+chunk(b\"IHDR\",struct.pack(\">IIBBBBB\",size,size,8,2,0,0,0))+chunk(b\"IDAT\",zlib.compress(raw))+chunk(b\"IEND\",b\"\"))\napp=pathlib.Path(\"build/SignedFixture/Payload/SignedFixture.app\")\npng(app/\"FixtureIcon60x60@2x.png\")\nbase={\"CFBundleIdentifier\":\"com.alaa.mirsa.ci.signedfolder\",\"CFBundleExecutable\":\"SignedFixture\",\"CFBundlePackageType\":\"APPL\",\"CFBundleDisplayName\":\"CI Signing Fixture\",\"CFBundleShortVersionString\":\"1.0\",\"CFBundleVersion\":\"1\"}\nicon=dict(base); icon[\"CFBundleIcons\"]={\"CFBundlePrimaryIcon\":{\"CFBundleIconFiles\":[\"FixtureIcon60x60\"]}}\n(app/\"Info.plist\").write_bytes(plistlib.dumps(icon))\nPY\ncodesign --force --sign - build/SignedFixture/Payload/SignedFixture.app\ncodesign --verify --strict build/SignedFixture/Payload/SignedFixture.app\nmkdir -p tests/fixtures\n(cd build/SignedFixture && zip -q -r ../../tests/fixtures/SignedFolder24Fixture.ipa Payload)\nmkdir -p build/NoIconFixture\ncp -R build/SignedFixture/Payload build/NoIconFixture/Payload\nrm build/NoIconFixture/Payload/SignedFixture.app/FixtureIcon60x60@2x.png\nrm -rf build/NoIconFixture/Payload/SignedFixture.app/_CodeSignature\npython3 - <<'PY'\nimport pathlib,plistlib\np=pathlib.Path(\"build/NoIconFixture/Payload/SignedFixture.app/Info.plist\")\nd=plistlib.loads(p.read_bytes()); d.pop(\"CFBundleIcons\"); d[\"CFBundleDisplayName\"]=\"CI No Icon Fixture\"\np.write_bytes(plistlib.dumps(d))\nPY\ncodesign --force --sign - build/NoIconFixture/Payload/SignedFixture.app\ncodesign --verify --strict build/NoIconFixture/Payload/SignedFixture.app\n(cd build/NoIconFixture && zip -q -r ../../tests/fixtures/SignedFolder24NoIcon.ipa Payload)\n"
    - name: Prepare owned native injection launch host
      run: 'mkdir -p build/GenericLaunch/Payload/GenericLaunch25.app

        xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -fobjc-arc tests/fixtures/generic-injection25/LaunchHost.m -framework UIKit -framework Foundation -Wl,-headerpad,4096 -o build/GenericLaunch/Payload/GenericLaunch25.app/GenericLaunch25

        python3 - <<''PY''

        import pathlib,plistlib

        app=pathlib.Path(''build/GenericLaunch/Payload/GenericLaunch25.app'')

        (app/''Info.plist'').write_bytes(plistlib.dumps(dict(CFBundleIdentifier=''com.mirsa.ci.genericlaunch25'',CFBundleExecutable=''GenericLaunch25'',CFBundlePackageType=''APPL'',CFBundleVersion=''1'',CFBundleShortVersionString=''1.0'')))

        PY

        codesign --force --sign - build/GenericLaunch/Payload/GenericLaunch25.app

        (cd build/GenericLaunch && zip -q -r ../../tests/fixtures/generic-injection25/GenericLaunch25Fixture.ipa Payload)

        '
    - name: Prepare exact owned Alaa and MirsaHookTest UIKit launch host
      run: "mkdir -p build/ExactLaunch/Payload/ExactLaunch25.app\nxcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -fobjc-arc tests/fixtures/exact-hooks25/ExactLaunch25.m -framework UIKit -framework Foundation -Wl,-headerpad,4096 -o build/ExactLaunch/Payload/ExactLaunch25.app/ExactLaunch25\npython3 - <<'PY25'\nimport pathlib,plistlib,hashlib\nfor name,digest in [('Alaa','04afc06b8a95d5ef1761bfa221bd1386f8762452970226d3c1ff64a4642d6565'),('MirsaHookTest','58e1161b49abb5ff332d6d9a368ab2d04c83a67d904b4cd5e92360b807b88997')]:\n    assert hashlib.sha256(pathlib.Path('tests/fixtures/exact-hooks25/'+name+'.dylib').read_bytes()).hexdigest()==digest\napp=pathlib.Path('build/ExactLaunch/Payload/ExactLaunch25.app')\ninfo=dict(CFBundleIdentifier='com.mirsa.ci.exactlaunch25',CFBundleExecutable='ExactLaunch25',CFBundlePackageType='APPL',CFBundleVersion='1',CFBundleShortVersionString='1.0',CFBundleSupportedPlatforms=['iPhoneOS'],LSRequiresIPhoneOS=True,UILaunchScreen={},UIApplicationSceneManifest={'UIApplicationSupportsMultipleScenes':False,'UISceneConfigurations':{'UIWindowSceneSessionRoleApplication':[{'UISceneConfigurationName':'Exact25','UISceneDelegateClassName':'ExactScene25'}]}})\n(app/'Info.plist').write_bytes(plistlib.dumps(info))\nPY25\ncodesign --force --sign - build/ExactLaunch/Payload/ExactLaunch25.app\n(cd build/ExactLaunch && zip -q -r ../../tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa Payload)\n"
    - name: Prepare Assets.car-only fixture (own actool compiled AppIcon, no loose icon PNGs)
      run: 'rm -rf build/CarFixture build/CarAssets

        mkdir -p build/CarAssets/Assets.xcassets/AppIcon.appiconset build/CarFixture/compiled

        python3 - <<''PY''

        import pathlib,json,zlib,struct

        size=1024

        row=b"\x00"+bytes((230,20,30))*size

        raw=row*size

        def chunk(t,d): c=struct.pack(">I",len(d))+t+d; return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)

        d=pathlib.Path("build/CarAssets/Assets.xcassets")

        (d/"AppIcon.appiconset/icon-1024.png").write_bytes(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",size,size,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))

        (d/"Contents.json").write_text(json.dumps({"info":{"version":1,"author":"xcode"}}))

        (d/"AppIcon.appiconset/Contents.json").write_text(json.dumps({"images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"icon-1024.png"}],"info":{"version":1,"author":"xcode"}}))

        PY

        xcrun actool build/CarAssets/Assets.xcassets --compile build/CarFixture/compiled --platform iphoneos --minimum-deployment-target 18.0 --app-icon AppIcon --output-partial-info-plist build/CarFixture/partial.plist --target-device iphone --target-device ipad

        test -s build/CarFixture/compiled/Assets.car

        mkdir -p build/CarFixture/Payload/SignedFixture.app

        cp build/SignedFixture/Payload/SignedFixture.app/SignedFixture build/CarFixture/Payload/SignedFixture.app/SignedFixture

        cp build/CarFixture/compiled/Assets.car build/CarFixture/Payload/SignedFixture.app/Assets.car

        python3 - <<''PY''

        import pathlib,plistlib

        base={"CFBundleIdentifier":"com.alaa.mirsa.ci.signedfolder.car","CFBundleExecutable":"SignedFixture","CFBundlePackageType":"APPL","CFBundleDisplayName":"CI Car Icon Fixture","CFBundleShortVersionString":"1.0","CFBundleVersion":"1","CFBundleIcons":{"CFBundlePrimaryIcon":{"CFBundleIconName":"AppIcon"}}}

        pathlib.Path("build/CarFixture/Payload/SignedFixture.app/Info.plist").write_bytes(plistlib.dumps(base))

        PY

        codesign --force --sign - build/CarFixture/Payload/SignedFixture.app

        codesign --verify --strict build/CarFixture/Payload/SignedFixture.app

        if find build/CarFixture/Payload -iname ''*.png'' | grep .; then echo "loose PNG present in car-only fixture"; exit 1; fi

        (cd build/CarFixture && zip -q -r ../../tests/fixtures/SignedFolder24CarIcon.ipa Payload)

        '
    - name: Freeze one owned host and all exact common input hashes
      run: 'set -euo pipefail

        mkdir -p build/same-payload

        python3 - <<''PY''

        from pathlib import Path

        import plistlib

        app=Path(''build/ExactLaunch/Payload/ExactLaunch25.app'')

        (app/''en.lproj'').mkdir(exist_ok=True)

        (app/''en.lproj/Localizable.strings'').write_bytes(plistlib.dumps({''settings'':''Settings'',''save'':''Save %@''}))

        PY

        codesign --force --sign - build/ExactLaunch/Payload/ExactLaunch25.app

        codesign --verify --deep --strict build/ExactLaunch/Payload/ExactLaunch25.app

        rm tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa

        (cd build/ExactLaunch && zip -q -r ../../tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa Payload)

        cp tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa build/same-payload/frozen-original.ipa

        python3 - <<''PY''

        from pathlib import Path

        import hashlib,json,subprocess

        paths=[''tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa'',''tests/fixtures/exact-hooks25/Alaa.dylib'',''tests/Fixtures/LCSignSynthetic.p12'',''tests/Fixtures/LCSignSynthetic.mobileprovision'',''loader/MirsaLoader.dylib'',''release296/loader/MirsaLoader.dylib'']

        proof={''candidate'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''baseline'':subprocess.check_output([''git'',''-C'',''release296'',''rev-parse'',''HEAD''],text=True).strip(),''files'':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}

        Path(''build/same-payload/frozen-inputs.json'').write_text(json.dumps(proof,indent=2))

        PY

        cp scripts/diagnostics/SamePayloadAB26Tests.swift tests/SamePayloadAB26Tests.swift

        bash scripts/prepare-privatekits-sdk.sh iphonesimulator

        brew install xcodegen

        xcodegen generate

        mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm

        cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved

        DEVICE=$(xcrun simctl list devices available -j | python3 -c ''import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))'')

        echo "MIRSA_AB_DEVICE=$DEVICE" >> "$GITHUB_ENV"

        xcrun simctl boot "$DEVICE" || true

        xcrun simctl bootstatus "$DEVICE" -b

        brew tap wix/brew

        brew install wix/brew/applesimutils

        applesimutils --byId "$DEVICE" --bundle com.alaa.mirsa --setPermissions "notifications=YES"

        xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en

        xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar'
    - name: Mint isolated one-hour staging fixture after runner queue
      env:
        MIRSA_RT_CI_ISSUER_SECRET: ${{ secrets.RT_STAGING_CI_ISSUER_SECRET }}
      run: python3 scripts/mint-runtime-ci-fixture25.py
    - name: Verify packaged endpoint matches the authenticated staging gate
      env:
        MIRSA_RT_STAGING_ENDPOINT: ${{ secrets.RT_STAGING_ENDPOINT }}
      run: "python3 - <<'PYENDPOINT'\nimport os, plistlib\nfrom pathlib import Path\nactual = plistlib.loads(Path('ios-app/Info.plist').read_bytes()).get('MirsaRuntimeTranslationEndpoint')\nexpected = os.environ.get('MIRSA_RT_STAGING_ENDPOINT')\nif not expected or actual != expected:\n    raise SystemExit('Packaged translation endpoint differs from the authenticated staging gate; refusing split-endpoint validation')\nprint('Packaged translation endpoint exactly matches the authenticated staging gate')\nPYENDPOINT\n"
    - name: Reject stale staging fixture before the native build
      run: 'python3 scripts/test-runtime-staging-fixture.py

        python3 scripts/check-runtime-staging-fixture.py

        '
    - name: Bind current archive hash to its independent build
      run: shasum -a 256 rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a > build/same-payload/current-engine.sha256
    - name: Production signing and immutable export current
      id: current
      continue-on-error: true
      env:
        TEST_RUNNER_MIRSA_AB_ENGINE: current
        TEST_RUNNER_MIRSA_RT_STAGING_ENDPOINT: ${{ secrets.RT_STAGING_ENDPOINT }}
        TEST_RUNNER_MIRSA_RT_REQUIRED_STAGING: '1'
      run: "set -euo pipefail\nmkdir -p build/same-payload/current\nset +e\nxcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination \"platform=iOS Simulator,id=$MIRSA_AB_DEVICE\" -derivedDataPath build/AB-current-DerivedData -clonedSourcePackagesDirPath \"$RUNNER_TEMP/ab-packages\" -resultBundlePath build/same-payload/current/Signing.xcresult -only-testing:MirsaTests/SamePayloadAB26Tests/testFrozenOwnHostAndPinnedAlaaFeatureMatrix test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS=\"$GITHUB_WORKSPACE/scripts/runtime-simulator-keychain.entitlements\" 2>&1 | tee build/same-payload/current/signing.log\nSTATUS=${PIPESTATUS[0]}\nset -e\nCONTAINER=$(xcrun simctl get_app_container \"$MIRSA_AB_DEVICE\" com.alaa.mirsa data)\nif [ -d \"$CONTAINER/Library/Application Support/SamePayloadAB26/current\" ]; then\n  cp -R \"$CONTAINER/Library/Application Support/SamePayloadAB26/current/.\" build/same-payload/current/\nfi\nexit \"$STATUS\""
    - name: Compile the literal released entire Rust engine, without candidate signer or loader substitutions
      run: 'set -euo pipefail

        export IPHONEOS_DEPLOYMENT_TARGET=18.0

        cargo build --release --manifest-path release296/rust-core/Cargo.toml --target aarch64-apple-ios-sim

        rm -rf AirliftFFI.xcframework

        xcodebuild -create-xcframework -library release296/rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers release296/rust-core/include -output AirliftFFI.xcframework

        shasum -a 256 release296/rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a > build/same-payload/released-engine.sha256

        xcrun simctl terminate "$MIRSA_AB_DEVICE" com.alaa.mirsa || true'
    - name: Production signing and immutable export released296
      id: released296
      continue-on-error: true
      env:
        TEST_RUNNER_MIRSA_AB_ENGINE: released296
        TEST_RUNNER_MIRSA_RT_STAGING_ENDPOINT: ${{ secrets.RT_STAGING_ENDPOINT }}
        TEST_RUNNER_MIRSA_RT_REQUIRED_STAGING: '1'
      run: "set -euo pipefail\nmkdir -p build/same-payload/released296\nset +e\nxcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination \"platform=iOS Simulator,id=$MIRSA_AB_DEVICE\" -derivedDataPath build/AB-released296-DerivedData -clonedSourcePackagesDirPath \"$RUNNER_TEMP/ab-packages\" -resultBundlePath build/same-payload/released296/Signing.xcresult -only-testing:MirsaTests/SamePayloadAB26Tests/testFrozenOwnHostAndPinnedAlaaFeatureMatrix test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS=\"$GITHUB_WORKSPACE/scripts/runtime-simulator-keychain.entitlements\" 2>&1 | tee build/same-payload/released296/signing.log\nSTATUS=${PIPESTATUS[0]}\nset -e\nCONTAINER=$(xcrun simctl get_app_container \"$MIRSA_AB_DEVICE\" com.alaa.mirsa data)\nif [ -d \"$CONTAINER/Library/Application Support/SamePayloadAB26/released296\" ]; then\n  cp -R \"$CONTAINER/Library/Application Support/SamePayloadAB26/released296/.\" build/same-payload/released296/\nfi\nexit \"$STATUS\""
    - name: Collect every cell with strict original signatures and unchanged Arabic alert requirement
      if: always()
      env:
        MIRSA_AB_CURRENT_OUTCOME: ${{ steps.current.outcome }}
        MIRSA_AB_RELEASED_OUTCOME: ${{ steps.released296.outcome }}
      run: 'set -euo pipefail

        python3 scripts/diagnostics/collect-same-payload26.py build/same-payload "$MIRSA_AB_DEVICE"

        test "$MIRSA_AB_CURRENT_OUTCOME" = success

        test "$MIRSA_AB_RELEASED_OUTCOME" = success'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Mirsa-same-payload-engine-comparison26
        path: build/same-payload
        if-no-files-found: error
        retention-days: 7
