name: Exact 2.9.4 source performance proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-performance:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0978bfb9294b9fb3af37cf121ebe0243e9f3b7a
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          swift --version
      - name: Exact source proof with visible native XCTest output
        run: |
          set -eo pipefail
          test "$(git rev-parse HEAD)" = e0978bfb9294b9fb3af37cf121ebe0243e9f3b7a
          git status --porcelain
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          python3 - <<'PATCH'
          from pathlib import Path
          p=Path('scripts/appstore/package-tests.sh')
          s=p.read_text()
          old='["swift", "test", "--parallel"]'
          assert old in s
          p.write_text(s.replace(old,'["swift", "test", "--filter", "SourceCatalogTests|SourceDeletionTests"]'))
          PATCH
          bash scripts/appstore/package-tests.sh 2>&1 | tee source-performance.log
          grep -E 'Alaa source performance alaa1: 7615167 bytes, 10380 apps, .*main-actor heartbeats=[1-9]' source-performance.log
          grep -E 'Alaa source performance alaa2: 9989723 bytes, 9728 apps, .*main-actor heartbeats=[1-9]' source-performance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-294-source-performance-proof
          path: source-performance.log
