name: Unsigned encrypted-embedded signing regression IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Encrypted embedded and resource signing tests
        run: |
          cargo test --manifest-path rust-core/vendor/apple-codesign-quick/Cargo.toml --lib encrypted_
          cargo test --manifest-path rust-core/vendor/apple-codesign-quick/Cargo.toml --lib embedded_resource_tests
          python3 scripts/test_signing_ranges.py
          python3 scripts/test_watch_signing.py
      - name: Localized file-error formatter
        run: swift scripts/test_signing_file_error.swift
      - name: Build device signer
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Generate project and build unsigned IPA
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 - <<'PYVERSION'
          from pathlib import Path
          p=Path('project.yml')
          s=p.read_text().replace('MARKETING_VERSION: "2.2"', 'MARKETING_VERSION: "2.9.4"')
          p.write_text(s)
          PYVERSION
          xcodegen generate
          bash build-ipa.sh
      - name: Stamp isolated diagnostic build and verify IPA
        run: |
          python3 - <<'PY'
          import plistlib,pathlib,zipfile,os
          p=pathlib.Path('build/Mirsa.ipa')
          with zipfile.ZipFile(p) as z: entries=[(i,z.read(i.filename)) for i in z.infolist()]
          # Deliberately above the owner's feed build 6.97.1, independently of workflow counters.
          build='8.'+str(int(os.environ['GITHUB_RUN_NUMBER'])%10000)+'.'+os.environ['GITHUB_RUN_ATTEMPT']
          with zipfile.ZipFile(p,'w',zipfile.ZIP_DEFLATED) as z:
              for i,b in entries:
                  if i.filename=='Payload/Mirsa.app/Info.plist' or ('.appex/' in i.filename and i.filename.endswith('/Info.plist')):
                      v=plistlib.loads(b);v['CFBundleVersion']=build;b=plistlib.dumps(v)
                  z.writestr(i,b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              v=plistlib.loads(z.read('Payload/Mirsa.app/Info.plist'))
              assert v['CFBundleVersion']==build
              assert v['CFBundleShortVersionString']=='2.9.4',v
              assert z.read('Payload/Mirsa.app/Mirsa')[:4]==bytes.fromhex('cffaedfe')
          print('Verified unsigned IPA build',build)
          PY
          shasum -a 256 build/Mirsa.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-encrypted-embedded-unsigned
          path: build/Mirsa.ipa
