name: Mirsa wifi guard tests
on:
  workflow_dispatch:
  push:
    branches: [kat/wifi-guard, kat/wifi18]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run WiFiPathPolicyTests
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/WiFi.xcresult -only-testing:MirsaTests/WiFiPathPolicyTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/wifi-tests.log
          grep -E "Executed [1-9][0-9]* tests?, with 0 failures" build/wifi-tests.log

          python3 - <<'PYTEST'
          import re
          from pathlib import Path
          text = Path("build/wifi-tests.log").read_text()
          names = ("testStateMapping", "testCellularActiveWithWiFiAvailableBlocks",
                   "testVerdictIsAuthoritative", "testEveryLanguageHasEveryNewMessage",
                   "testNextStepAddedOnceForAnyFailure")
          for name in names:
              assert re.search(r"Test Case '-\[MirsaTests\.WiFiPathPolicyTests " + name + r"\]' passed", text), name + " did not execute and pass"
          assert not re.search(r"Test Case .*WiFiPathPolicyTests.*skipped", text), "WiFi tests skipped"
          print("All five named WiFiPathPolicyTests executed and passed")
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-wifi-policy-proof
          path: |
            build/wifi-tests.log
            build/WiFi.xcresult
          if-no-files-found: error
