name: Browser IPA validate
on:
  workflow_dispatch:
  push:
    branches: [kat/browser-ipa]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pure policy tests (no release, no artifact)
        run: |
          set -o pipefail
          mkdir -p dk/Sources/DiscoveryKit dk/Tests/DiscoveryKitTests
          for f in DiscoveryCore DiscoveryArchive DiscoveryProviders DiscoveryDownloader DiscoveryAuth; do cp ios-app/Discovery/$f.swift dk/Sources/DiscoveryKit/; done
          cp ios-app/Apps/MirsaBrowserPolicy.swift dk/Sources/DiscoveryKit/
          cp tests/MirsaBrowserPolicyTests.swift dk/Tests/DiscoveryKitTests/
          cat > dk/Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "DiscoveryKit", platforms: [.macOS(.v13), .iOS(.v16)],
            products: [.library(name: "DiscoveryKit", targets: ["DiscoveryKit"])],
            targets: [.target(name: "DiscoveryKit"), .testTarget(name: "DiscoveryKitTests", dependencies: ["DiscoveryKit"])])
          EOF
          cd dk && swift test 2>&1 | tee /tmp/t.log
