name: Sources and existing libraries validation
# Validation only: builds, tests and screenshots. Never publishes a release,
# a tag or a source (no gh release / gh-pages steps, read-only token).
on:
  workflow_dispatch:
  push:
    branches: [kat/sources-libraries]
permissions:
  contents: read
jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Rust unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml --lib
      - name: Localization checks
        run: |
          python3 ios-app/localization-coverage-test.py
          python3 ios-app/localization-plural-test.py
      - name: Build AirliftFFI for iOS (device)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build unsigned IPA (same script as unsigned-ipa.yml, no publishing)
        run: |
          brew install xcodegen && xcodegen generate
          bash build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-unsigned-sources-libraries
          path: build/Mirsa.ipa
          if-no-files-found: error

  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Boot simulator
        run: |
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")]; pick=[d for d in ds if d["name"] in ("iPhone 16 Pro","iPhone 17 Pro")] or ds; print(pick[0]["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/Unit.xcresult -only-testing:MirsaTests/SourceDeletionTests -only-testing:MirsaTests/MirsaSourceFeedTests -only-testing:MirsaTests/SourceURLActionTests -only-testing:MirsaTests/ExistingProjectLibrariesTests -only-testing:MirsaTests/ExistingProjectLibrariesUITests -only-testing:MirsaTests/PersonalProjectIntegrationTests -only-testing:MirsaTests/PersonalProjectFolderTests -only-testing:MirsaTests/PersonalProjectPerformanceTests -only-testing:MirsaTests/ProjectDetailsNoInstallLinkTests -only-testing:MirsaTests/EncryptedAppsTests -only-testing:MirsaTests/InstallErrorTextTests -only-testing:MirsaTests/OpenInIPATests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit.log
      - name: Encrypted tab screenshots
        run: |
          set -o pipefail
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/Shots.xcresult -only-testing:MirsaUITests/EncryptedTabScreenshotsUITests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/shots.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/shots
          for BUNDLE in Unit Shots; do
            if [ -d "build/$BUNDLE.xcresult" ]; then
              mkdir -p "build/raw-$BUNDLE"
              xcrun xcresulttool export attachments --path "build/$BUNDLE.xcresult" --output-path "build/raw-$BUNDLE"
              BUNDLE="$BUNDLE" python3 - <<'PYCODE'
          import json, os, re, shutil
          bundle = os.environ["BUNDLE"]
          raw = f"build/raw-{bundle}"
          for test in json.load(open(f"{raw}/manifest.json")):
              for attachment in test.get("attachments", []):
                  filename = attachment["exportedFileName"]
                  if not filename.lower().endswith(".png"): continue
                  name = attachment.get("suggestedHumanReadableName") or filename
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(\.\w+)$", r"\1", name)
                  name = os.path.basename(name)
                  if not name.lower().endswith(".png"): name += ".png"
                  shutil.copy(os.path.join(raw, filename), os.path.join("build/shots", bundle + "-" + name))
          print("\n".join(sorted(os.listdir("build/shots"))))
          PYCODE
            fi
          done
          mkdir -p build/crashes
          cp ~/Library/Logs/DiagnosticReports/*Mirsa* build/crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sources-libraries-validation-shots
          path: |
            build/shots
            build/crashes
            build/unit.log
            build/shots.log
          if-no-files-found: warn
