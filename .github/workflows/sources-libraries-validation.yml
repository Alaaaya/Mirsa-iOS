name: Sources store native validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build and verify store
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          mkdir -p build
          xcodebuild test -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DD -resultBundlePath build/StoreUnit.xcresult -only-testing:MirsaTests/SourceStoreCatalogueTests -only-testing:MirsaTests/SourceDeletionTests -only-testing:MirsaTests/SourceNewsTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/store-unit.log
          xcodebuild test -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DD -resultBundlePath build/StoreUI.xcresult -only-testing:MirsaUITests/SourceStoreScreenshotsUITests -only-testing:MirsaUITests/SourceDeletionFlowUITests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/store-ui.log
      - name: Export original screenshots
        if: always()
        run: |
          mkdir -p build/raw
          if [ -d build/StoreUI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/StoreUI.xcresult --output-path build/raw
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sources-store-native-proof
          path: |
            build/raw
            build/store-unit.log
            build/store-ui.log
          if-no-files-found: error
