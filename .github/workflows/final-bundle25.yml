name: Activated translation launch diagnostic 26
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activated:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact online-empty activated simulator host
        env:
          CI_DICTIONARY26: ${{ secrets.RT_CI_DRIFT128_DICTIONARY26 }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          pathlib.Path('runtime-translation/fixtures/DriftExact128Translations26.json').write_text(os.environ['CI_DICTIONARY26'])
          PYTHON
          bash runtime-translation/activated-smoke26.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activated-translation-diagnostic26
          path: build/activated26
          retention-days: 3
