          cmp tests/fixtures/SignedFolder24NoIcon.ipa "$RETAINED2/SignedFolder24NoIcon.ipa"
          RETAINED3="$CONTAINER/Library/Application Support/MirsaSignedExports/2C5D5FD4-F3C2-4FA2-9B4D-4B9F3A2D7E11"
          mkdir -p "$RETAINED3"
          cp tests/fixtures/SignedFolder24CarIcon.ipa "$RETAINED3/SignedFolder24CarIcon.ipa"
          cp build/CarFixture/Payload/SignedFixture.app/Info.plist "$RETAINED3/Info.plist"
