name: Final integrated bundle private validation
on:
  workflow_dispatch:
    inputs:
      exact_launch_diagnostic:
        description: 'Read-only replay of exact signed fixture from failed run 45805899206. Never builds a release.'
        type: boolean
        default: false
  push:
    branches: [mirsa/final-bundle25, mirsa/integrated-runtime-hook25]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  MIRSA_RELEASE_BUILD: "8.543.5"
jobs:
  exact-launch-diagnostic:
    if: ${{ inputs.exact_launch_diagnostic == true }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45805899206
          name: Mirsa-final25-Arabic-proof
          path: diagnostic-source
      - name: Replay unmodified production signed own fixture with passive dyld diagnostics
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          export SIMCTL_CHILD_DYLD_PRINT_LIBRARIES=1
          export SIMCTL_CHILD_DYLD_PRINT_INITIALIZERS=1
          python3 scripts/verify-exact-hook-launch25.py diagnostic-source/build/production-sign-proof "$DEVICE" 2>&1 | tee diagnostic-source/exact-replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-exact-launch-diagnostic26
          path: |
            diagnostic-source/exact-replay.log
            diagnostic-source/build/production-sign-proof/*launch*.log
            diagnostic-source/build/production-sign-proof/*failure*.png
            diagnostic-source/build/production-sign-proof/exact-hook-launch-verification.json
            diagnostic-source/build/production-sign-proof/exact-*-Arabic-alert.png

  native-hook-smoke:
    if: ${{ inputs.exact_launch_diagnostic != true }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Translation injection preserves every existing dylib ordinal
        run: python3 scripts/test-translation-ordinals26.py
      - name: Build and exercise own Substrate-compatible engine
        run: |
          bash hook-engine/test-macos.sh
          python3 scripts/test-hook-localization.py

  backend:
    if: ${{ inputs.exact_launch_diagnostic != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Backend unit and schema type checks
        run: |
          node --test backend/runtime-translate/logic.test.mjs backend/mcp-translation-relay/extension.test.mjs backend/mcp-translation-relay/contract.test.mjs backend/mcp-translation-relay/routing.test.mjs
          deno check backend/runtime-translate/index.ts backend/runtime-translate/staging.ts backend/runtime-translate/operator.ts
          deno test --allow-read backend/runtime-translate/security.test.ts
      - name: Disposable schema and concurrent durable quota validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          bash backend/runtime-translate/test-postgres.sh

      - name: Authenticated provider 429 and 503 queue durability and shared batching throttle
        env:
          RUNTIME_TEST_ACTIVATION_PEM: ${{ secrets.RT_STAGING_ACTIVATION_PEM }}
        run: |
          umask 077
          test -n "$RUNTIME_TEST_ACTIVATION_PEM"
          sudo mkdir -p /home/kit
          sudo chown "$(id -u):$(id -g)" /home/kit
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$RUNTIME_TEST_ACTIVATION_PEM" > "$KEY"
          unset RUNTIME_TEST_ACTIVATION_PEM
          RUNTIME_ACTIVATION_PRIVATE_KEY_FILE="$KEY" python3 backend/runtime-translate/e2e-staging.py | tee backend-fallback-proof.log
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-final25-backend-fallback-proof
          path: backend-fallback-proof.log
          if-no-files-found: error

  build:
    needs: [simulator, backend, native-hook-smoke]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Rebuild all embedded device libraries from this exact revision
        run: |
          python3 scripts/test-hook-build-boundary.py
          python3 scripts/verify-native-fixture-uuid26.py
          rm -f hook-engine/dist/CydiaSubstrate.framework/CydiaSubstrate
          bash hook-engine/build.sh
          python3 scripts/test-verify-hook-engine.py
          python3 scripts/verify-hook-engine.py
          (cd runtime-translation && clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation MergeRace.m -o /tmp/mirsa-merge-race && /tmp/mirsa-merge-race)
          bash runtime-translation/build-apple.sh
          bash background-notifications/build-apple.sh
          python3 background-notifications/test_background.py
          mkdir -p runtime-translation/out
          cp ios-app/RuntimeTranslationAssets/MirsaTranslate.dylib runtime-translation/out/MirsaTranslate.dylib
          (cd runtime-translation && python3 test_runtime.py)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Test Rust validation
        run: cargo test --manifest-path rust-core/Cargo.toml --lib
      - name: Build Rust device library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build application
        run: |
          bash scripts/prepare-privatekits-sdk.sh iphoneos
          brew install xcodegen
          # Device packaging does not build tests. Keep their generated IPA inputs
          # strict in project.yml and all simulator gates, omit only in this spec.
          python3 scripts/prepare-device-build-spec26.py
          xcodegen generate --spec project.device.generated.yml
          rm project.device.generated.yml
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          bash build-ipa.sh
          python3 background-notifications/validate_ipa.py build/Mirsa.ipa
          python3 - <<'PYVERIFY'
          import hashlib, json, pathlib, plistlib, zipfile
          root = pathlib.Path(".")
          with zipfile.ZipFile("build/Mirsa.ipa") as z:
              app = "Payload/Mirsa.app/"
              assets = app + "RuntimeTranslationAssets/"
              for name in ("MirsaTranslate.dylib", "provenance.json"):
                  expected = (root / "ios-app/RuntimeTranslationAssets" / name).read_bytes()
                  assert z.read(assets + name) == expected, "packaged runtime resource mismatch: " + name
              proof = json.loads(z.read(assets + "provenance.json"))
              assert proof["genericTableEmpty"] is True
              assert proof["dylibSHA256"] == hashlib.sha256(z.read(assets + "MirsaTranslate.dylib")).hexdigest()
              for name, digest in proof["sources"].items():
                  assert hashlib.sha256((root / "runtime-translation" / name).read_bytes()).hexdigest() == digest
              info = plistlib.loads(z.read(app + "Info.plist"))
              executable = z.read(app + info["CFBundleExecutable"])
              hook = (root / "hook-engine/dist/CydiaSubstrate.framework/CydiaSubstrate").read_bytes()
              assert hook in executable, "exact rebuilt hook engine not embedded in packaged executable"
          print("Exact-revision runtime provenance and embedded hook resource verified in final IPA")
          PYVERIFY
          shasum -a 256 build/Mirsa.ipa > build/device.sha256
          git rev-parse HEAD > build/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-final25-private-device
          path: |
            build/Mirsa.ipa
            build/device.sha256
            build/source-revision.txt
          if-no-files-found: error

  simulator:
    if: ${{ inputs.exact_launch_diagnostic != true }}
    needs: [backend, native-hook-smoke]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Mint isolated one-hour staging fixture after runner queue
        env:
          MIRSA_RT_CI_ISSUER_SECRET: ${{ secrets.RT_STAGING_CI_ISSUER_SECRET }}
        run: python3 scripts/mint-runtime-ci-fixture25.py
      - name: Verify packaged endpoint matches the authenticated staging gate
        env:
          MIRSA_RT_STAGING_ENDPOINT: ${{ secrets.RT_STAGING_ENDPOINT }}
        run: |
          python3 - <<'PYENDPOINT'
          import os, plistlib
          from pathlib import Path
          actual = plistlib.loads(Path('ios-app/Info.plist').read_bytes()).get('MirsaRuntimeTranslationEndpoint')
          expected = os.environ.get('MIRSA_RT_STAGING_ENDPOINT')
          if not expected or actual != expected:
              raise SystemExit('Packaged translation endpoint differs from the authenticated staging gate; refusing split-endpoint validation')
          print('Packaged translation endpoint exactly matches the authenticated staging gate')
          PYENDPOINT
      - name: Reject stale staging fixture before the native build
        run: |
          python3 scripts/test-runtime-staging-fixture.py
          python3 scripts/check-runtime-staging-fixture.py
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Rebuild all embedded device libraries from this exact revision
        run: |
          python3 scripts/test-hook-build-boundary.py
          python3 scripts/verify-native-fixture-uuid26.py
          rm -f hook-engine/dist/CydiaSubstrate.framework/CydiaSubstrate
          bash hook-engine/build.sh
          python3 scripts/test-verify-hook-engine.py
          python3 scripts/verify-hook-engine.py
          (cd runtime-translation && clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation MergeRace.m -o /tmp/mirsa-merge-race && /tmp/mirsa-merge-race)
          bash runtime-translation/build-apple.sh
          bash background-notifications/build-apple.sh
          python3 background-notifications/test_background.py
          mkdir -p runtime-translation/out
          cp ios-app/RuntimeTranslationAssets/MirsaTranslate.dylib runtime-translation/out/MirsaTranslate.dylib
          (cd runtime-translation && python3 test_runtime.py)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo test --manifest-path rust-core/vendor/apple-codesign-quick/Cargo.toml --lib
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Execute native UIKit, placeholder, bidi, logger and privacy smoke
        run: bash runtime-translation/simulator-smoke.sh 2>&1 | tee runtime-native-smoke.log
      - name: Prove embedded-dictionary first frame and OTA cache after real relaunch
        run: |
          export LAUNCH_PROOF_OUTPUT="$GITHUB_WORKSPACE/build/launch-proof"
          bash runtime-translation/launch-proof-smoke.sh
      - name: Prepare own-code real ad-hoc signed IPA fixture
        run: |
          mkdir -p build/SignedFixture/Payload/SignedFixture.app
          printf 'int main(void) { return 0; }\n' > build/SignedFixture/main.c
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=18.0 build/SignedFixture/main.c -o build/SignedFixture/Payload/SignedFixture.app/SignedFixture
          python3 - <<'PY'
          import pathlib,plistlib,zlib,struct
          def png(path,size=120):
              rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      if (x//15+y//15)%2==0: px=(255,0,200)
                      else: px=(255,230,0)
                      if abs(x-y)<8 or abs(x+y-size)<8: px=(0,200,255)
                      row+=bytes(px)
                  rows.append(bytes(row))
              raw=b"".join(rows)
              def chunk(t,d): c=struct.pack(">I",len(d))+t+d; return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
              path.write_bytes(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",size,size,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))
          app=pathlib.Path("build/SignedFixture/Payload/SignedFixture.app")
          png(app/"FixtureIcon60x60@2x.png")
          base={"CFBundleIdentifier":"com.alaa.mirsa.ci.signedfolder","CFBundleExecutable":"SignedFixture","CFBundlePackageType":"APPL","CFBundleDisplayName":"CI Signing Fixture","CFBundleShortVersionString":"1.0","CFBundleVersion":"1"}
          icon=dict(base); icon["CFBundleIcons"]={"CFBundlePrimaryIcon":{"CFBundleIconFiles":["FixtureIcon60x60"]}}
          (app/"Info.plist").write_bytes(plistlib.dumps(icon))
          PY
          codesign --force --sign - build/SignedFixture/Payload/SignedFixture.app
          codesign --verify --strict build/SignedFixture/Payload/SignedFixture.app
          mkdir -p tests/fixtures
          (cd build/SignedFixture && zip -q -r ../../tests/fixtures/SignedFolder24Fixture.ipa Payload)
          mkdir -p build/NoIconFixture
          cp -R build/SignedFixture/Payload build/NoIconFixture/Payload
          rm build/NoIconFixture/Payload/SignedFixture.app/FixtureIcon60x60@2x.png
          rm -rf build/NoIconFixture/Payload/SignedFixture.app/_CodeSignature
          python3 - <<'PY'
          import pathlib,plistlib
          p=pathlib.Path("build/NoIconFixture/Payload/SignedFixture.app/Info.plist")
          d=plistlib.loads(p.read_bytes()); d.pop("CFBundleIcons"); d["CFBundleDisplayName"]="CI No Icon Fixture"
          p.write_bytes(plistlib.dumps(d))
          PY
          codesign --force --sign - build/NoIconFixture/Payload/SignedFixture.app
          codesign --verify --strict build/NoIconFixture/Payload/SignedFixture.app
          (cd build/NoIconFixture && zip -q -r ../../tests/fixtures/SignedFolder24NoIcon.ipa Payload)
      - name: Prepare owned native injection launch host
        run: |
          mkdir -p build/GenericLaunch/Payload/GenericLaunch25.app
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -fobjc-arc tests/fixtures/generic-injection25/LaunchHost.m -framework UIKit -framework Foundation -Wl,-headerpad,4096 -o build/GenericLaunch/Payload/GenericLaunch25.app/GenericLaunch25
          python3 - <<'PY'
          import pathlib,plistlib
          app=pathlib.Path('build/GenericLaunch/Payload/GenericLaunch25.app')
          (app/'Info.plist').write_bytes(plistlib.dumps(dict(CFBundleIdentifier='com.mirsa.ci.genericlaunch25',CFBundleExecutable='GenericLaunch25',CFBundlePackageType='APPL',CFBundleVersion='1',CFBundleShortVersionString='1.0')))
          PY
          codesign --force --sign - build/GenericLaunch/Payload/GenericLaunch25.app
          (cd build/GenericLaunch && zip -q -r ../../tests/fixtures/generic-injection25/GenericLaunch25Fixture.ipa Payload)
      - name: Prepare exact owned Alaa and MirsaHookTest UIKit launch host
        run: |
          mkdir -p build/ExactLaunch/Payload/ExactLaunch25.app
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -fobjc-arc tests/fixtures/exact-hooks25/ExactLaunch25.m -framework UIKit -framework Foundation -Wl,-headerpad,4096 -o build/ExactLaunch/Payload/ExactLaunch25.app/ExactLaunch25
          python3 - <<'PY25'
          import pathlib,plistlib,hashlib
          for name,digest in [('Alaa','04afc06b8a95d5ef1761bfa221bd1386f8762452970226d3c1ff64a4642d6565'),('MirsaHookTest','58e1161b49abb5ff332d6d9a368ab2d04c83a67d904b4cd5e92360b807b88997')]:
              assert hashlib.sha256(pathlib.Path('tests/fixtures/exact-hooks25/'+name+'.dylib').read_bytes()).hexdigest()==digest
          app=pathlib.Path('build/ExactLaunch/Payload/ExactLaunch25.app')
          info=dict(CFBundleIdentifier='com.mirsa.ci.exactlaunch25',CFBundleExecutable='ExactLaunch25',CFBundlePackageType='APPL',CFBundleVersion='1',CFBundleShortVersionString='1.0',CFBundleSupportedPlatforms=['iPhoneOS'],LSRequiresIPhoneOS=True,UILaunchScreen={},UIApplicationSceneManifest={'UIApplicationSupportsMultipleScenes':False,'UISceneConfigurations':{'UIWindowSceneSessionRoleApplication':[{'UISceneConfigurationName':'Exact25','UISceneDelegateClassName':'ExactScene25'}]}})
          (app/'Info.plist').write_bytes(plistlib.dumps(info))
          PY25
          codesign --force --sign - build/ExactLaunch/Payload/ExactLaunch25.app
          (cd build/ExactLaunch && zip -q -r ../../tests/fixtures/exact-hooks25/ExactLaunch25Fixture.ipa Payload)
      - name: Prepare Assets.car-only fixture (own actool compiled AppIcon, no loose icon PNGs)
        run: |
          rm -rf build/CarFixture build/CarAssets
          mkdir -p build/CarAssets/Assets.xcassets/AppIcon.appiconset build/CarFixture/compiled
          python3 - <<'PY'
          import pathlib,json,zlib,struct
          size=1024
          row=b"\x00"+bytes((230,20,30))*size
          raw=row*size
          def chunk(t,d): c=struct.pack(">I",len(d))+t+d; return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          d=pathlib.Path("build/CarAssets/Assets.xcassets")
          (d/"AppIcon.appiconset/icon-1024.png").write_bytes(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",size,size,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))
          (d/"Contents.json").write_text(json.dumps({"info":{"version":1,"author":"xcode"}}))
          (d/"AppIcon.appiconset/Contents.json").write_text(json.dumps({"images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"icon-1024.png"}],"info":{"version":1,"author":"xcode"}}))
          PY
          xcrun actool build/CarAssets/Assets.xcassets --compile build/CarFixture/compiled --platform iphoneos --minimum-deployment-target 18.0 --app-icon AppIcon --output-partial-info-plist build/CarFixture/partial.plist --target-device iphone --target-device ipad
          test -s build/CarFixture/compiled/Assets.car
          mkdir -p build/CarFixture/Payload/SignedFixture.app
          cp build/SignedFixture/Payload/SignedFixture.app/SignedFixture build/CarFixture/Payload/SignedFixture.app/SignedFixture
          cp build/CarFixture/compiled/Assets.car build/CarFixture/Payload/SignedFixture.app/Assets.car
          python3 - <<'PY'
          import pathlib,plistlib
          base={"CFBundleIdentifier":"com.alaa.mirsa.ci.signedfolder.car","CFBundleExecutable":"SignedFixture","CFBundlePackageType":"APPL","CFBundleDisplayName":"CI Car Icon Fixture","CFBundleShortVersionString":"1.0","CFBundleVersion":"1","CFBundleIcons":{"CFBundlePrimaryIcon":{"CFBundleIconName":"AppIcon"}}}
          pathlib.Path("build/CarFixture/Payload/SignedFixture.app/Info.plist").write_bytes(plistlib.dumps(base))
          PY
          codesign --force --sign - build/CarFixture/Payload/SignedFixture.app
          codesign --verify --strict build/CarFixture/Payload/SignedFixture.app
          if find build/CarFixture/Payload -iname '*.png' | grep .; then echo "loose PNG present in car-only fixture"; exit 1; fi
          (cd build/CarFixture && zip -q -r ../../tests/fixtures/SignedFolder24CarIcon.ipa Payload)
      - name: Run actual SwiftUI integration and Arabic snapshots
        env:
          TEST_RUNNER_MIRSA_RT_STAGING_ENDPOINT: ${{ secrets.RT_STAGING_ENDPOINT }}
          TEST_RUNNER_MIRSA_RT_REQUIRED_STAGING: "1"
        run: |
          set -euo pipefail
          test -n "$TEST_RUNNER_MIRSA_RT_STAGING_ENDPOINT" || { echo "Required staging endpoint missing"; exit 1; }
          test -n "$TEST_RUNNER_MIRSA_RT_STAGING_TOKEN" || { echo "Required staging token missing"; exit 1; }
          bash scripts/prepare-privatekits-sdk.sh iphonesimulator
          brew install xcodegen
          xcodegen generate
          python3 scripts/configure-ui-language-tests.py
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          # A pending Mirsa notification prompt blocks genuine foreground activation
          # of the later exact-payload UIKit host. Set only the CI app's permission
          # before its first launch; never synthesize host lifecycle notifications.
          brew tap wix/brew
          brew install wix/brew/applesimutils
          applesimutils --byId "$DEVICE" --bundle com.alaa.mirsa --setPermissions "notifications=YES"
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/PersonalUI.xcresult -only-testing:MirsaTests/DiscoveryAuthTests -only-testing:MirsaTests/RuntimeArabicTranslation25Tests -only-testing:MirsaTests/RuntimeTranslationScanner25Tests -only-testing:MirsaTests/RuntimeStagingNetwork25Tests -only-testing:MirsaTests/RuntimeStagingSession25Tests -only-testing:MirsaTests/BackgroundNotifications25Tests -only-testing:MirsaTests/GeneralArabicLocalization24Tests -only-testing:MirsaTests/ArabicLocalize31Tests -only-testing:MirsaTests/SignedAppsFolder24Tests -only-testing:MirsaTests/CertificateInstallTests -only-testing:MirsaTests/SourceCatalogTests/testMainAppSearchMatchesAppsOnlyAcrossSourcesAndInvalidatesCache -only-testing:MirsaTests/SourceCatalogTests/testVersionDisplayNormalizesOnlyLeadingPrefixes test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/scripts/runtime-simulator-keychain.entitlements" 2>&1 | tee build/simulator-validation.log
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.alaa.mirsa data)
          mkdir -p build/production-sign-proof
          cp "$CONTAINER/Library/Application Support/RuntimeSigningProof25/ON.ipa" build/production-sign-proof/
          cp "$CONTAINER/Library/Application Support/RuntimeSigningProof25/ON-dictionary-proof.json" build/production-sign-proof/
          cp "$CONTAINER/Library/Application Support/RuntimeSigningProof25/OFF.ipa" build/production-sign-proof/
          python3 scripts/diagnostics/test-lcsign-identity.py
          python3 scripts/test-verify-production-sign25.py
          python3 scripts/test-verify-native-launch25.py
          python3 scripts/verify-production-sign25.py build/production-sign-proof
          cp "$CONTAINER/Library/Application Support/RuntimeSigningProof25/"GENERIC-*.ipa* build/production-sign-proof/
          python3 scripts/verify-generic-launch25.py build/production-sign-proof "$DEVICE" 2>&1 | tee build/production-sign-proof/generic-launch.log
          cp "$CONTAINER/Library/Application Support/RuntimeSigningProof25/"EXACT-*.ipa* build/production-sign-proof/
          python3 scripts/verify-exact-hook-launch25.py build/production-sign-proof "$DEVICE" 2>&1 | tee build/production-sign-proof/exact-launch.log
          RETAINED="$CONTAINER/Library/Application Support/MirsaSignedExports/0A3A3FB2-D1A0-48F0-91D2-397B285B6ED5"
          mkdir -p "$RETAINED"
          cp tests/fixtures/SignedFolder24Fixture.ipa "$RETAINED/SignedFolder24Fixture.ipa"
          cp build/SignedFixture/Payload/SignedFixture.app/Info.plist "$RETAINED/Info.plist"
          RETAINED2="$CONTAINER/Library/Application Support/MirsaSignedExports/1B4C4FC3-E2B1-49A1-82E8-3A8C396C7EE6"
          mkdir -p "$RETAINED2"
          cp tests/fixtures/SignedFolder24NoIcon.ipa "$RETAINED2/SignedFolder24NoIcon.ipa"
