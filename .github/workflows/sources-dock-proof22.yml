name: Sources dock clearance native proof
on:
  push:
    branches: [fix/sources-dock-22nov]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    timeout-minutes: 55
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Compile/test the immutable source candidate before committing runtime code.
      # Once committed, the exact same bytes pass through without an overlay.
      - name: Verify exact Sources candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BLOB: 6c12ca578ed1a2c6ea9c66c8deafd93dde41362e
          BEFORE_SHA256: 40e72c00b8e32d9ac5bf1374b7e77277313a02d1e82d9c3b9812c240f79a25ca
          AFTER_SHA256: 3e7f9f7a7c8ce96cfa2128b98c1aa9971323855da8f7af601e4e0b43693ad3e3
        run: |
          python3 - <<'CHECK'
          import base64, hashlib, json, os, pathlib, urllib.request
          p = pathlib.Path('ios-app/Apps/SourcesTab.swift')
          before = hashlib.sha256(p.read_bytes()).hexdigest()
          committed = before == os.environ['AFTER_SHA256']
          if not committed:
              assert before == os.environ['BEFORE_SHA256'], 'Unexpected Sources revision'
              url = 'https://api.github.com/repos/Alaaaya/Mirsa-iOS/git/blobs/' + os.environ['CANDIDATE_BLOB']
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  candidate = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha256(candidate).hexdigest() == os.environ['AFTER_SHA256']
              p.write_bytes(candidate)
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/source-proof.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'sourceSHA256': hashlib.sha256(p.read_bytes()).hexdigest(), 'committedSource': committed, 'candidateBlob': os.environ['CANDIDATE_BLOB']}, indent=2))
          CHECK
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Run app screenshots tests
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/SourcesEdgeUI.xcresult -only-testing:MirsaUITests/CertificateParity29UITests/testArabicPushedSourceLastRowClearsDock -only-testing:MirsaUITests/CertificateParity29UITests/testEnglishPushedSourceLastRowClearsDock -only-testing:MirsaUITests/MirsaSourcesEdgeUITests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-validation.log
      - name: Export runtime screenshot attachments
        if: always()
        run: |
          if [ -d build/SourcesEdgeUI.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments --path build/SourcesEdgeUI.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-sources-dock-native-proof
          path: |
            build/source-proof.json
            build/screenshots
            build/SourcesEdgeUI.xcresult
            build/simulator-validation.log
          if-no-files-found: warn
