name: Signed apps folder private validation
on:
  workflow_dispatch:
  push:
    branches: [mirsa/signed-folder24]
permissions:
  contents: read
jobs:
  build:
    needs: simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Test Rust validation
        run: cargo test --manifest-path rust-core/Cargo.toml --lib
      - name: Build Rust device library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Build application
        run: |
          bash scripts/prepare-privatekits-sdk.sh iphoneos
          brew install xcodegen
          xcodegen generate
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          bash build-ipa.sh
          shasum -a 256 build/Mirsa.ipa > build/device.sha256
          git rev-parse HEAD > build/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-signed-folder24-private-device
          path: |
            build/Mirsa.ipa
            build/device.sha256
            build/source-revision.txt
          if-no-files-found: error

  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Build real simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Prepare own-code real ad-hoc signed IPA fixture
        run: |
          mkdir -p build/SignedFixture/Payload/SignedFixture.app
          printf 'int main(void) { return 0; }\n' > build/SignedFixture/main.c
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=18.0 build/SignedFixture/main.c -o build/SignedFixture/Payload/SignedFixture.app/SignedFixture
          python3 - <<'PY'
          import pathlib,plistlib,zlib,struct
          def png(path,size=120):
              rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      if (x//15+y//15)%2==0: px=(255,0,200)
                      else: px=(255,230,0)
                      if abs(x-y)<8 or abs(x+y-size)<8: px=(0,200,255)
                      row+=bytes(px)
                  rows.append(bytes(row))
              raw=b"".join(rows)
              def chunk(t,d): c=struct.pack(">I",len(d))+t+d; return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
              path.write_bytes(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",size,size,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))
          app=pathlib.Path("build/SignedFixture/Payload/SignedFixture.app")
          png(app/"FixtureIcon60x60@2x.png")
          base={"CFBundleIdentifier":"com.alaa.mirsa.ci.signedfolder","CFBundleExecutable":"SignedFixture","CFBundlePackageType":"APPL","CFBundleDisplayName":"CI Signing Fixture","CFBundleShortVersionString":"1.0","CFBundleVersion":"1"}
          icon=dict(base); icon["CFBundleIcons"]={"CFBundlePrimaryIcon":{"CFBundleIconFiles":["FixtureIcon60x60"]}}
          (app/"Info.plist").write_bytes(plistlib.dumps(icon))
          PY
          codesign --force --sign - build/SignedFixture/Payload/SignedFixture.app
          codesign --verify --strict build/SignedFixture/Payload/SignedFixture.app
          mkdir -p tests/fixtures
          (cd build/SignedFixture && zip -q -r ../../tests/fixtures/SignedFolder24Fixture.ipa Payload)
          mkdir -p build/NoIconFixture
          cp -R build/SignedFixture/Payload build/NoIconFixture/Payload
          rm build/NoIconFixture/Payload/SignedFixture.app/FixtureIcon60x60@2x.png
          rm -rf build/NoIconFixture/Payload/SignedFixture.app/_CodeSignature
          python3 - <<'PY'
          import pathlib,plistlib
          p=pathlib.Path("build/NoIconFixture/Payload/SignedFixture.app/Info.plist")
          d=plistlib.loads(p.read_bytes()); d.pop("CFBundleIcons"); d["CFBundleDisplayName"]="CI No Icon Fixture"
          p.write_bytes(plistlib.dumps(d))
          PY
          codesign --force --sign - build/NoIconFixture/Payload/SignedFixture.app
          codesign --verify --strict build/NoIconFixture/Payload/SignedFixture.app
          (cd build/NoIconFixture && zip -q -r ../../tests/fixtures/SignedFolder24NoIcon.ipa Payload)
      - name: Run actual SwiftUI integration and Arabic snapshots
        run: |
          set -o pipefail
          bash scripts/prepare-privatekits-sdk.sh iphonesimulator
          brew install xcodegen
          xcodegen generate
          python3 scripts/configure-ui-language-tests.py
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Dependencies/Package.resolved vendor/ApplePackage/Package.resolved
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array ar en
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale ar
          mkdir -p build
          xcodebuild -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/PersonalUI.xcresult -only-testing:MirsaTests/SignedAppsFolder24Tests -only-testing:MirsaTests/CertificateInstallTests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-validation.log
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.alaa.mirsa data)
          RETAINED="$CONTAINER/Library/Application Support/MirsaSignedExports/0A3A3FB2-D1A0-48F0-91D2-397B285B6ED5"
          mkdir -p "$RETAINED"
          cp tests/fixtures/SignedFolder24Fixture.ipa "$RETAINED/SignedFolder24Fixture.ipa"
          cp build/SignedFixture/Payload/SignedFixture.app/Info.plist "$RETAINED/Info.plist"
          RETAINED2="$CONTAINER/Library/Application Support/MirsaSignedExports/1B4C4FC3-E2B1-49A1-82E8-3A8C396C7EE6"
          mkdir -p "$RETAINED2"
          cp tests/fixtures/SignedFolder24NoIcon.ipa "$RETAINED2/SignedFolder24NoIcon.ipa"
          cp build/NoIconFixture/Payload/SignedFixture.app/Info.plist "$RETAINED2/Info.plist"
          cmp tests/fixtures/SignedFolder24NoIcon.ipa "$RETAINED2/SignedFolder24NoIcon.ipa"
          cmp tests/fixtures/SignedFolder24Fixture.ipa "$RETAINED/SignedFolder24Fixture.ipa"
          xcodebuild -project Mirsa.xcodeproj -scheme MirsaUI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/SimulatorData -resultBundlePath build/SignedFolderUI.xcresult -only-testing:MirsaUITests/SignedAppsFolder24UITests test CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/signed-folder-ui.log
      - name: Export runtime screenshot attachments
        if: always()
        run: |
          if [ -d build/PersonalUI.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments --path build/PersonalUI.xcresult --output-path build/screenshots
          fi
          if [ -d build/SignedFolderUI.xcresult ]; then
            mkdir -p build/ui-screenshots
            xcrun xcresulttool export attachments --path build/SignedFolderUI.xcresult --output-path build/ui-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mirsa-signed-folder24-Arabic-proof
          path: |
            build/screenshots
            build/ui-screenshots
            build/SignedFolderUI.xcresult
            build/signed-folder-ui.log
            build/PersonalUI.xcresult
            build/simulator-validation.log
          if-no-files-found: warn
