name: Combined final launch smoke
on:
  workflow_dispatch:
  push:
    branches: [mirsa/final-combined, mirsa/bundle-2.8]
permissions:
  contents: read
jobs:
  swift-layout:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: simulator
      - name: Verify imported IPA pre-existing library safety
        run: python3 scripts/appstore/preinjected-tests.py
      - name: Build simulator FFI
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --target aarch64-apple-ios-sim
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a -headers rust-core/include -output AirliftFFI.xcframework
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved Mirsa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build, boot, launch smoke
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcodebuild build -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | tail -5
          APP=$(ls -d dd/Build/Products/*/Mirsa.app)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.alaa.mirsa
          sleep 25
          # Consume launchctl output completely before matching. grep -q can
          # terminate its producer with SIGPIPE and falsely fail under pipefail.
          xcrun simctl spawn "$DEVICE" launchctl list > launchctl-list.txt
          awk '$1 ~ /^[1-9][0-9]*$/ && index($3, "com.alaa.mirsa") { running=1 } END { exit !running }' launchctl-list.txt || { cat launchctl-list.txt; echo "app has no running launchd PID"; exit 1; }
          xcrun simctl io "$DEVICE" screenshot launch.png
          echo "launch ok"
      - name: Verify wallpaper ownership regressions
        run: |
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g))')
          xcodebuild test -project Mirsa.xcodeproj -scheme Mirsa -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -only-testing:MirsaTests/MirsaWallpaperOwnershipTests | tail -30
        shell: bash -eo pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-shot
          path: launch.png

